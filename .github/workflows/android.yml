name: Android Build (NDK + Gradle)

on: push: branches: [ main ] workflow_dispatch:

jobs: build: runs-on: ubuntu-latest

steps:

- name: Checkout sources

  uses: actions/checkout@v4


- name: Setup Java 17

  uses: actions/setup-java@v4

  with:

    distribution: 'temurin'

    java-version: '17'


- name: Install Android command-line tools

  uses: android-actions/setup-android@v2

  with:

    api-level: 35


- name: Install Android SDK components (platforms, build-tools, NDK, CMake)

  run: |

    yes | sdkmanager --licenses

    sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"


- name: Download Gradle distribution

  run: |

    GRADLE_VERSION=8.6.4

    wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip

    unzip -q gradle-${GRADLE_VERSION}-bin.zip

    echo "GRADLE_HOME=$PWD/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV

    echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH


- name: Unpack project and build APK

  env:

    ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

  run: |

    ZIP_NAME="BlackboxOffline_WHISPER_COMPACT.zip"

    if [ ! -f "$ZIP_NAME" ]; then

      echo "ZIP $ZIP_NAME not found in repo root. Listing files:"

      ls -la

      exit 1

    fi

    unzip -q "$ZIP_NAME"

    # try to detect top folder created by unzip

    FOLDER=$(unzip -Z -1 "$ZIP_NAME" | head -n1 | cut -d/ -f1)

    if [ -z "$FOLDER" ] || [ ! -d "$FOLDER" ]; then

      # fallback: first directory in current folder

      FOLDER=$(ls -1 | grep -v '^\.' | head -n1)

    fi

    echo "Project folder: $FOLDER"

    cd "$FOLDER" || (echo "Cannot cd to $FOLDER" && exit 1)

    # give Gradle more memory for native build

    gradle assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g"


- name: Upload APK artifact

  uses: actions/upload-artifact@v4

  with:

    name: app-release

    path: '**/app/build/outputs/apk/release/*.apk'

