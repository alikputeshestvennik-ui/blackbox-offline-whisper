name: Android Build

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK with NDK
      run: |
        unzip BlackboxOffline_WHISPER_COMPACT.zip
        cd BlackboxOffline_WHISPER_COMPACT
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: BlackboxOffline_WHISPER_COMPACT/app/build/outputs/apk/release/*.apk
